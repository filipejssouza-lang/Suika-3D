<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Suika 3D — Fruit Merge</title>
    <script src="three.min.js"></script>
    <style>
        :root {
            --bg-top: #FFE5EC;
            --bg-bottom: #FFF0F3;
            --primary: #FF477E;
            --accent: #FF758F;
            --dark: #2B2D42;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(180deg, #FAD0C4 0%, #FFD1FF 100%);
            font-family: 'Segoe UI', -apple-system, Roboto, sans-serif;
            touch-action: none;
        }

        #webgl-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Top HUD */
        .hud-container {
            position: absolute;
            top: env(safe-area-inset-top, 16px);
            left: 16px;
            right: 16px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 10;
            pointer-events: none;
        }

        .hud-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 8px 16px;
            border-radius: 20px;
            box-shadow: 0 4px 16px rgba(43, 45, 66, 0.08);
            border: 2px solid #FFFFFF;
            text-align: center;
        }

        .hud-label {
            font-size: 11px;
            font-weight: 700;
            color: #8D99AE;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .hud-value {
            font-size: 24px;
            font-weight: 800;
            color: var(--dark);
        }

        .next-preview {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .next-preview canvas {
            width: 44px;
            height: 44px;
        }

        /* Floating Score Popups */
        #popups-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 20;
            overflow: hidden;
        }

        .popup-score {
            position: absolute;
            font-size: 20px;
            font-weight: 900;
            color: #FF477E;
            text-shadow: 0 2px 8px rgba(255, 255, 255, 0.9);
            transform: translate(-50%, -50%);
            animation: floatUp 0.7s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
        }

        @keyframes floatUp {
            0% { opacity: 0; transform: translate(-50%, 0) scale(0.5); }
            30% { opacity: 1; transform: translate(-50%, -20px) scale(1.3); }
            100% { opacity: 0; transform: translate(-50%, -50px) scale(0.9); }
        }

        /* Game Over Modal */
        #gameover-modal {
            position: absolute;
            inset: 0;
            background: rgba(43, 45, 66, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-card {
            background: #FFFFFF;
            padding: 32px 28px;
            border-radius: 28px;
            text-align: center;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.2);
            max-width: 320px;
            width: 90%;
            animation: popIn 0.35s cubic-bezier(0.18, 0.89, 0.32, 1.28);
        }

        @keyframes popIn {
            0% { transform: scale(0.7); opacity: 0; }
            100% { transform: scale(1.0); opacity: 1; }
        }

        .modal-title {
            font-size: 26px;
            font-weight: 800;
            color: var(--dark);
            margin-bottom: 8px;
        }

        .modal-score {
            font-size: 42px;
            font-weight: 900;
            color: var(--primary);
            margin: 8px 0;
        }

        .modal-best {
            font-size: 13px;
            color: #8D99AE;
            font-weight: 600;
            margin-bottom: 24px;
        }

        .btn-restart {
            background: linear-gradient(135deg, #FF477E, #FF758F);
            color: #FFFFFF;
            border: none;
            padding: 14px 32px;
            border-radius: 24px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 71, 126, 0.4);
            transition: transform 0.1s ease;
        }

        .btn-restart:active {
            transform: scale(0.95);
        }

        /* Evolution Wheel Guide (Bottom Hint) */
        .evolution-bar {
            position: absolute;
            bottom: env(safe-area-inset-bottom, 12px);
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1.5px solid #FFFFFF;
            box-shadow: 0 4px 16px rgba(43, 45, 66, 0.06);
            z-index: 10;
            pointer-events: none;
        }

        .evolution-icon {
            font-size: 16px;
        }

        .evolution-arrow {
            font-size: 10px;
            color: #8D99AE;
        }
    </style>
</head>
<body>
    <canvas id="webgl-canvas"></canvas>

    <div class="hud-container">
        <div class="hud-card">
            <div class="hud-label">Pontuação</div>
            <div class="hud-value" id="score-val">0</div>
        </div>

        <div class="hud-card next-preview">
            <div class="hud-label">Próxima</div>
            <div id="next-fruit-emoji" style="font-size: 26px; height: 32px; line-height: 32px;">🍒</div>
        </div>

        <div class="hud-card">
            <div class="hud-label">Recorde</div>
            <div class="hud-value" id="best-val">0</div>
        </div>
    </div>

    <div id="popups-layer"></div>

    <div class="evolution-bar">
        <span class="evolution-icon">🍒</span>
        <span class="evolution-arrow">→</span>
        <span class="evolution-icon">🍓</span>
        <span class="evolution-arrow">→</span>
        <span class="evolution-icon">🍇</span>
        <span class="evolution-arrow">→</span>
        <span class="evolution-icon">🍊</span>
        <span class="evolution-arrow">→</span>
        <span class="evolution-icon">🍎</span>
        <span class="evolution-arrow">→</span>
        <span class="evolution-icon">🍉</span>
    </div>

    <div id="gameover-modal">
        <div class="modal-card">
            <div class="modal-title">Fim de Jogo! 🍉</div>
            <div class="modal-score" id="final-score">0</div>
            <div class="modal-best" id="final-best">Recorde: 0</div>
            <button class="btn-restart" id="btn-restart" onclick="restartGame()">Jogar Novamente</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
